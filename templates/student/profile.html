{% extends "base.html" %}
{% block content %}
<h2>Student Profile</h2>
<form method="POST" enctype="multipart/form-data">
    <div class="mb-3">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" class="form-control" id="name" name="name" value="{{ student.name }}" required>
    </div>
    <div class="mb-3">
        <label for="contact" class="form-label">Contact</label>
        <input type="text" class="form-control" id="contact" name="contact" value="{{ student.contact }}">
    </div>

    <div class="mb-3">
        <label for="branch" class="form-label">Branch</label>
        <input type="text" class="form-control" id="branch" name="branch" value="{{ student.branch or '' }}">
    </div>
    <div class="mb-3">
        <label for="year" class="form-label">Year</label>
        <input type="number" class="form-control" id="year" name="year" value="{{ student.year or '' }}">
    </div>
    <div class="mb-3">
        <label for="cgpa" class="form-label">CGPA</label>
        <input type="number" step="0.01" class="form-control" id="cgpa" name="cgpa" value="{{ student.cgpa or '' }}">
    </div>

    <div class="mb-3">
        <label for="resume" class="form-label">Resume (PDF/DOC/DOCX)</label>
        <input type="file" class="form-control" id="resume" name="resume" accept=".pdf,.doc,.docx">
        {% if student.resume_path %}
        <p>Current: <a href="{{ url_for('static', filename='uploads/resumes/' + student.resume_path) }}" target="_blank">View Resume</a></p>
        {% endif %}
    </div>
    <button type="submit" class="btn btn-primary">Update Profile</button>
</form>
{% endblock %}
